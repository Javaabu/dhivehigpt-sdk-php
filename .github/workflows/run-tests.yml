name: tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  tests:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
        php: [ 8.4, 8.3, 8.2, 8.1, 8.0 ]
        laravel: [ 13.*, 12.*, 11.*, 10.*, 9.* ]
        stability: [ prefer-lowest, prefer-stable ]
        include:
          - laravel: 13.*
            testbench: 11.*
          - laravel: 12.*
            testbench: 10.*
          - laravel: 11.*
            testbench: ^9.16
          - laravel: 10.*
            testbench: 8.*
          - laravel: 9.*
            testbench: 7.*
        exclude:
          # Laravel 13 requires PHP 8.3+
          - laravel: 13.*
            php: 8.2
          - laravel: 13.*
            php: 8.1
          - laravel: 13.*
            php: 8.0
          # Laravel 11 and 12 require PHP 8.2+
          - laravel: 12.*
            php: 8.1
          - laravel: 12.*
            php: 8.0
          - laravel: 11.*
            php: 8.1
          - laravel: 11.*
            php: 8.0
          # Laravel 10 requires PHP 8.1+
          - laravel: 10.*
            php: 8.0
          # Laravel 9 supports up to PHP 8.2
          - laravel: 9.*
            php: 8.3
          - laravel: 9.*
            php: 8.4

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      -   name: Checkout code
          uses: actions/checkout@v4

      -   name: Setup PHP
          uses: shivammathur/setup-php@v2
          with:
            php-version: ${{ matrix.php }}
            extensions: curl, mbstring, json, dom, libxml
            coverage: ${{ startsWith(github.event.head_commit.message, 'coverage') && matrix.php == '8.4' && matrix.laravel == '13.*' && matrix.stability == 'prefer-stable' && 'xdebug' || 'none' }}

      -   name: Install dependencies
          run: |
              composer require "laravel/framework:${{ matrix.laravel }}" "illuminate/support:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
              composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      -   name: Execute tests
          run: |
              vendor/bin/phpunit ${{ startsWith(github.event.head_commit.message, 'coverage') && matrix.php == '8.4' && matrix.laravel == '13.*' && matrix.stability == 'prefer-stable' && '--coverage-clover=clover.xml' || '' }}

      -   name: Make code coverage badge
          if: startsWith(github.event.head_commit.message, 'coverage') && matrix.php == '8.4' && matrix.laravel == '13.*' && matrix.stability == 'prefer-stable'
          uses: timkrase/phpunit-coverage-badge@v1.2.1
          with:
              coverage_badge_path: .github/coverage.svg
              push_badge: true
              repo_token: ${{ secrets.GITHUB_TOKEN }}
